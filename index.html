<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="員工記錄">
<title>員工記錄手機 App</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f4f5f7;
  color:#111827;
  font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:24px 18px;
}

h1{
  margin:0;
  font-size:27px;
}

.sub{
  margin-top:5px;
  color:#cbd5e1;
}

main{
  max-width:650px;
  margin:auto;
  padding:15px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:17px;
  margin-bottom:14px;
  box-shadow:0 2px 12px #0000000d;
}

label{
  display:block;
  font-weight:800;
  margin:0 0 8px;
}

input{
  width:100%;
  height:56px;
  border:1px solid #d1d5db;
  border-radius:14px;
  padding:0 15px;
  font-size:19px;
  background:#fff;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

button{
  height:55px;
  border:0;
  border-radius:14px;
  font-size:18px;
  font-weight:800;
  width:100%;
}

.primary{
  background:#111827;
  color:#fff;
  margin-top:13px;
}

.light{
  background:#eef2f7;
  color:#111827;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.blue{
  background:#2563eb;
  color:white;
}

.status{
  text-align:center;
  min-height:24px;
  padding-top:8px;
  font-weight:800;
}

.ok{
  color:#15803d;
}

.err{
  color:#b91c1c;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.count{
  font-size:40px;
  font-weight:900;
}

.muted{
  color:#6b7280;
  font-size:14px;
}

.order{
  border:1px solid #e5e7eb;
  border-radius:14px;
  padding:12px;
  margin-top:9px;
}

.orderline{
  display:flex;
  justify-content:space-between;
  font-weight:800;
}

.modal{
  position:fixed;
  inset:0;
  background:#0008;
  display:flex;
  align-items:flex-end;
  z-index:10;
}

.modal.hidden,
.hidden{
  display:none;
}

.modalbox{
  background:white;
  width:100%;
  padding:18px 15px 30px;
  border-radius:22px 22px 0 0;
}

.modalbox button{
  margin-top:10px;
}

.empty{
  text-align:center;
  color:#9ca3af;
  padding:20px;
}

.small{
  font-size:14px;
  height:40px;
}

@media(max-width:480px){
  .row{
    grid-template-columns:1fr;
  }

  .grid2{
    grid-template-columns:1fr 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>員工記錄</h1>
  <div class="sub">手機版｜資料儲存在本機</div>
</header>

<main>

<section id="staff">

  <div class="card">

    <label>時間</label>
    <input id="time" type="datetime-local">

    <div style="height:12px"></div>

    <div class="row">

      <div>
        <label>金額</label>
        <input
          id="amount"
          type="number"
          inputmode="numeric"
          min="0"
          placeholder="例如 500"
        >
      </div>

      <div>
        <label>電話末三碼</label>
        <input
          id="phone"
          type="tel"
          inputmode="numeric"
          maxlength="3"
          placeholder="可留空"
        >
      </div>

    </div>

    <button id="add" class="primary" type="button">
      ＋ 新增紀錄
    </button>

    <div id="status" class="status"></div>

  </div>


  <div class="card grid2">
    <button id="manager" class="light" type="button">
      老闆管理
    </button>

    <button id="clear" class="light" type="button">
      清空輸入
    </button>
  </div>


  <div class="card">
    <b>今日已新增紀錄</b>

    <div id="count" class="count">0</div>

    <div class="muted">
      員工頁只顯示筆數，不顯示總金額。
    </div>
  </div>


  <div class="card">
    <b>最近 5 筆訂單</b>

    <div id="recent"></div>
  </div>

</section>


<section id="boss" class="hidden">

  <div class="card">

    <div style="display:flex;justify-content:space-between;align-items:center">

      <b>老闆管理</b>

      <button
        id="back"
        class="light small"
        style="width:auto;padding:0 14px"
        type="button"
      >
        返回
      </button>

    </div>

    <hr>

    <div class="grid2">

      <div>
        <div class="muted">總筆數</div>
        <div id="totalCount" class="count">0</div>
      </div>

      <div>
        <div class="muted">總金額</div>
        <div id="totalAmount" class="count">$0</div>
      </div>

    </div>

  </div>


  <div class="card">

    <div class="grid2">

      <button id="export" class="blue" type="button">
        匯出 CSV
      </button>

      <button id="deleteAll" class="danger" type="button">
        清除全部
      </button>

    </div>

    <div id="all"></div>

  </div>

</section>

</main>


<div id="login" class="modal hidden">

  <div class="modalbox">

    <h2>老闆管理</h2>

    <input
      id="pw"
      type="password"
      inputmode="numeric"
      maxlength="4"
      placeholder="輸入 0922"
    >

    <button id="loginBtn" class="primary" type="button">
      進入管理頁
    </button>

    <button id="cancel" class="light" type="button">
      取消
    </button>

  </div>

</div>


<script>

(function(){

"use strict";


var memoryRecords = [];

var storageOK = true;

var KEY = "employee_record_data_v3";

var PASSWORD = "0922";


function getData(){

  if(!storageOK){
    return memoryRecords.slice();
  }

  try{

    var s = localStorage.getItem(KEY);

    return s ? JSON.parse(s) : [];

  }catch(e){

    storageOK = false;

    return memoryRecords.slice();

  }

}


function setData(data){

  memoryRecords = data.slice();

  try{

    localStorage.setItem(
      KEY,
      JSON.stringify(data)
    );

    storageOK = true;

  }catch(e){

    storageOK = false;

  }

}


function $(id){
  return document.getElementById(id);
}


function pad(n){
  return String(n).padStart(2,"0");
}


function nowValue(){

  var d = new Date();

  return d.getFullYear()
    + "-"
    + pad(d.getMonth()+1)
    + "-"
    + pad(d.getDate())
    + "T"
    + pad(d.getHours())
    + ":"
    + pad(d.getMinutes());

}


function formatTime(s){

  if(!s) return "";

  var d = new Date(s);

  if(isNaN(d.getTime())){
    return s;
  }

  return d.getFullYear()
    + "/"
    + pad(d.getMonth()+1)
    + "/"
    + pad(d.getDate())
    + " "
    + pad(d.getHours())
    + ":"
    + pad(d.getMinutes());

}


function money(n){

  return Number(n || 0).toLocaleString("zh-TW");

}


function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    function(c){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#39;"
      }[c];

    }
  );

}


function status(msg,good){

  $("status").textContent = msg;

  $("status").className =
    "status " + (good ? "ok" : "err");

  setTimeout(function(){

    $("status").textContent = "";

    $("status").className = "status";

  },2500);

}


function refresh(){

  var data = getData();


  $("count").textContent =
    data.filter(function(r){

      var a = new Date(r.time);

      var b = new Date();

      return a.getFullYear() === b.getFullYear()
        && a.getMonth() === b.getMonth()
        && a.getDate() === b.getDate();

    }).length;


  var five = data.slice(0,5);


  if(!five.length){

    $("recent").innerHTML =
      '<div class="empty">目前還沒有訂單</div>';

  }else{

    $("recent").innerHTML =
      five.map(function(r,i){

        return '<div class="order">'
          + '<div class="orderline">'
          + '<span>第 '+(i+1)+' 筆</span>'
          + '<span>$'+money(r.amount)+'</span>'
          + '</div>'
          + '<div class="muted">'
          + '時間：'+esc(formatTime(r.time))
          + '<br>'
          + '電話末三碼：'
          + (r.phone ? esc(r.phone) : "未填")
          + '</div>'
          + '</div>';

      }).join("");

  }

}


function renderBoss(){

  var data = getData();


  $("totalCount").textContent =
    data.length;


  $("totalAmount").textContent =
    "$"
    + money(
        data.reduce(
          function(t,r){
            return t + Number(r.amount || 0);
          },
          0
        )
      );


  if(!data.length){

    $("all").innerHTML =
      '<div class="empty">目前沒有紀錄</div>';

    return;

  }


  $("all").innerHTML =
    data.map(function(r,i){

      return '<div class="order">'

        + '<div class="orderline">'
        + '<span>#'+(data.length-i)+'</span>'
        + '<span>$'+money(r.amount)+'</span>'
        + '</div>'

        + '<div class="muted">'
        + '時間：'+esc(formatTime(r.time))
        + '<br>'
        + '電話末三碼：'
        + (r.phone ? esc(r.phone) : "未填")
        + '</div>'

        + '<button'
        + ' class="danger small del"'
        + ' data-id="'+esc(r.id)+'"'
        + ' type="button"'
        + ' style="margin-top:8px"'
        + '>刪除</button>'

        + '</div>';

    }).join("");


  Array.from(
    document.querySelectorAll(".del")
  ).forEach(function(btn){

    btn.onclick = function(){

      if(!confirm("確定刪除這筆紀錄？")){
        return;
      }

      setData(
        getData().filter(function(r){
          return r.id !== btn.getAttribute("data-id");
        })
      );

      renderBoss();

      refresh();

    };

  });

}


$("time").value = nowValue();


$("add").onclick = function(){

  var amountText =
    $("amount").value.trim();

  var phone =
    $("phone").value.trim();

  var time =
    $("time").value;


  if(amountText === ""){

    status("請先輸入金額",false);

    $("amount").focus();

    return;

  }


  var amount =
    Number(amountText);


  if(!isFinite(amount) || amount < 0){

    status("金額格式不正確",false);

    $("amount").focus();

    return;

  }


  if(
    phone !== ""
    &&
    !/^\d{3}$/.test(phone)
  ){

    status(
      "電話末三碼請輸入 3 碼，或直接留空",
      false
    );

    $("phone").focus();

    return;

  }


  var data = getData();


  data.unshift({

    id:
      String(Date.now())
      + String(Math.random()).slice(2),

    time:
      time || nowValue(),

    amount:
      amount,

    phone:
      phone

  });


  setData(data);


  $("amount").value = "";

  $("phone").value = "";

  $("time").value = nowValue();


  refresh();

  status("✓ 已新增紀錄",true);

};


$("clear").onclick = function(){

  $("amount").value = "";

  $("phone").value = "";

  $("time").value = nowValue();

  status("已清空輸入",true);

};


$("manager").onclick = function(){

  $("pw").value = "";

  $("login").classList.remove("hidden");

  $("pw").focus();

};


$("cancel").onclick = function(){

  $("login").classList.add("hidden");

};


$("loginBtn").onclick = function(){

  if($("pw").value === PASSWORD){

    $("login").classList.add("hidden");

    $("staff").classList.add("hidden");

    $("boss").classList.remove("hidden");

    renderBoss();

  }else{

    alert("密碼錯誤");

    $("pw").value = "";

    $("pw").focus();

  }

};


$("pw").onkeydown = function(e){

  if(e.key === "Enter"){
    $("loginBtn").click();
  }

};


$("back").onclick = function(){

  $("boss").classList.add("hidden");

  $("staff").classList.remove("hidden");

  refresh();

};


$("deleteAll").onclick = function(){

  if(!getData().length){

    alert("目前沒有紀錄");

    return;

  }


  if(confirm("確定清除全部紀錄？")){

    setData([]);

    renderBoss();

    refresh();

  }

};


$("export").onclick = function(){

  var data = getData();


  if(!data.length){

    alert("目前沒有資料可以匯出");

    return;

  }


  var rows = [
    ["時間","金額","電話末三碼"]
  ];


  data.forEach(function(r){

    rows.push([
      formatTime(r.time),
      r.amount,
      r.phone || ""
    ]);

  });


  var csv =
    "\uFEFF"
    +
    rows.map(function(row){

      return row.map(function(v){

        return '"'
          + String(v).replace(/"/g,'""')
          + '"';

      }).join(",");

    }).join("\r\n");


  var blob =
    new Blob(
      [csv],
      {
        type:"text/csv;charset=utf-8"
      }
    );


  var url =
    URL.createObjectURL(blob);


  var a =
    document.createElement("a");


  a.href = url;

  a.download = "員工記錄.csv";

  document.body.appendChild(a);

  a.click();

  a.remove();


  setTimeout(function(){

    URL.revokeObjectURL(url);

  },1000);

};


refresh();

})();

</script>

</body>
</html>
